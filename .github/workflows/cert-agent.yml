name: CERT AGENT — CI + JWKS Sync

on:
  push:
    branches: [ main ]
    paths:
      - ".well-known/jwks.json"
      - "src/**"
      - "cert_agent_backend/**"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-and-test:
    name: 🧪 Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run linting and static checks
        run: |
          pip install yamllint
          yamllint .github/workflows || true

      - name: Confirm JWKS exists
        run: |
          test -f .well-known/jwks.json && echo "JWKS file found ✅" || (echo "❌ Missing .well-known/jwks.json" && exit 1)

  sync-jwks:
    name: 🔄 Sync JWKS to Public Repo
    runs-on: ubuntu-latest
    needs: build-and-test
    if: ${{ success() }}
    env:
      CERT_AGENT_API_KEY: ${{ secrets.CERT_AGENT_API_KEY }}
      NAME: "CERT AGENT"

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4

      - name: Checkout public JWKS repo
        uses: actions/checkout@v4
        with:
          repository: BKK7108/certagent-jwks
          path: public-jwks
          ssh-key: ${{ secrets.JWKS_DEPLOY_KEY }}
          persist-credentials: false
          ref: main

      - name: Copy JWKS file
        run: |
          mkdir -p public-jwks/.well-known
          cp .well-known/jwks.json public-jwks/.well-known/jwks.json

      - name: Commit and push if changed
        run: |
          cd public-jwks
          git config user.name  "cert-agent-bot"
          git config user.email "bot@cert-agent.io"
          if ! git diff --quiet .; then
            git add .well-known/jwks.json
            git commit -m "Sync JWKS from private repo (\$(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
            git push origin main
          else
            echo "No JWKS changes to sync."
          fi
